[build]
  publish = "."
  functions = "netlify/functions"

# Evitar que los navegadores guarden versiones viejas de la página en caché
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
